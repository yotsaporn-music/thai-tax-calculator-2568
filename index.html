<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เครื่องคิดเลขภาษีเงินได้ ปีภาษี 2568</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Sarabun', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    * { -webkit-tap-highlight-color: transparent; }

    /* ═══════ PRINT STYLES ═══════ */
    @page {
      size: A4;
      margin: 12mm 14mm;
    }

    @media print {
      body { background: #fff !important; font-size: 11pt; }

      /* hide everything that shouldn't print */
      .no-print { display: none !important; }

      /* force all accordion sections open */
      .print-section-content { display: block !important; }

      /* summary cards: 2-column grid */
      .print-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
      .print-card {
        border: 1.5px solid #f9a8d4;
        border-radius: 8px;
        padding: 8px 12px;
        background: #fff;
        page-break-inside: avoid;
      }
      .print-card.pink { background: #fdf2f8; }
      .print-card p.label { font-size: 8pt; color: #6b7280; margin: 0 0 2px; }
      .print-card p.value { font-size: 14pt; font-weight: 700; color: #000; margin: 0; }

      /* result banner */
      .print-banner {
        border-radius: 8px;
        padding: 10px 14px;
        text-align: center;
        margin-bottom: 12px;
        page-break-inside: avoid;
      }
      .print-banner.due   { border: 2px solid #fca5a5; background: #fff1f2; }
      .print-banner.refund { border: 2px solid #86efac; background: #f0fdf4; }
      .print-banner .banner-label { font-size: 9pt; color: #6b7280; margin: 0 0 2px; }
      .print-banner .banner-amount { font-size: 20pt; font-weight: 700; margin: 0; }
      .print-banner.due   .banner-amount { color: #dc2626; }
      .print-banner.refund .banner-amount { color: #16a34a; }

      /* section headers */
      .print-sec-header {
        background: #fce7f3;
        border-radius: 6px 6px 0 0;
        padding: 5px 10px;
        font-weight: 700;
        font-size: 10pt;
        color: #000;
        border: 1px solid #fbcfe8;
        margin-top: 10px;
      }
      .print-sec-body {
        border: 1px solid #fbcfe8;
        border-top: none;
        border-radius: 0 0 6px 6px;
        padding: 8px 10px;
        background: #fff;
        page-break-inside: avoid;
      }

      /* calc rows */
      .calc-row { display: flex; justify-content: space-between; padding: 1.5px 0; font-size: 9.5pt; }
      .calc-row.indent { padding-left: 14px; }
      .calc-row.bold { font-weight: 600; }
      .calc-row.highlight { background: #fdf2f8; padding: 3px 6px; border-radius: 4px; font-weight: 700; color: #9d174d; }
      .calc-row.red { color: #dc2626; font-weight: 700; }
      .calc-row.green { color: #16a34a; font-weight: 700; }
      .calc-row.dim span:first-child { color: #6b7280; }
      .divider { border: none; border-top: 1px solid #fbcfe8; margin: 4px 0; }
      .divider.dark { border-top: 1.5px solid #000; }

      /* bracket table */
      .bracket-table { width: 100%; border-collapse: collapse; font-size: 9pt; }
      .bracket-table th { background: #fce7f3; padding: 4px 6px; text-align: left; border: 1px solid #fbcfe8; font-weight: 600; }
      .bracket-table td { padding: 3px 6px; border: 1px solid #fbcfe8; }
      .bracket-table tr.active { background: #f9a8d4; font-weight: 700; }
      .bracket-table tr.used { background: #fdf2f8; }
      .bracket-table tfoot td { background: #fce7f3; font-weight: 700; }

      /* disclaimer */
      .print-disclaimer {
        margin-top: 12px;
        font-size: 7.5pt;
        color: #9ca3af;
        border-top: 1px dashed #fbcfe8;
        padding-top: 6px;
      }

      /* print header */
      .print-header { text-align: center; margin-bottom: 14px; page-break-after: avoid; }
      .print-header h1 { font-size: 15pt; font-weight: 700; color: #000; margin: 0 0 2px; }
      .print-header p { font-size: 9pt; color: #be185d; margin: 0; }
      .print-header .date-line { font-size: 8pt; color: #9ca3af; margin-top: 2px; }
    }

    /* screen: hide print-only elements */
    @media screen {
      .print-only { display: none !important; }
    }
  </style>
</head>
<body class="bg-pink-50">
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo } = React;

const PASSWORD = "HRMEGA2026";

const INCOME_TYPES = [
  { value: '40_1', label: 'ม.40(1) เงินเดือน/ค่าจ้าง', rate: 0.5, cap: 100000 },
  { value: '40_2', label: 'ม.40(2) รับจ้างทำงาน', rate: 0.5, cap: 100000 },
  { value: '40_3', label: 'ม.40(3) ค่าแห่งลิขสิทธิ์', rate: 0.5, cap: 100000 },
  { value: '40_5', label: 'ม.40(5) ค่าเช่า', rate: 0.3, cap: null },
  { value: '40_6', label: 'ม.40(6) วิชาชีพอิสระ (แพทย์/ทนาย/วิศวกร)', rate: 0.6, cap: null },
  { value: '40_7', label: 'ม.40(7) รับเหมาก่อสร้าง', rate: 0.7, cap: null },
  { value: '40_8', label: 'ม.40(8) รายได้อื่น ๆ', rate: 0.6, cap: null },
];

const BRACKETS = [
  { min: 0,       max: 150000,   rate: 0,    label: '0 – 150,000' },
  { min: 150000,  max: 300000,   rate: 0.05, label: '150,001 – 300,000' },
  { min: 300000,  max: 500000,   rate: 0.10, label: '300,001 – 500,000' },
  { min: 500000,  max: 750000,   rate: 0.15, label: '500,001 – 750,000' },
  { min: 750000,  max: 1000000,  rate: 0.20, label: '750,001 – 1,000,000' },
  { min: 1000000, max: 2000000,  rate: 0.25, label: '1,000,001 – 2,000,000' },
  { min: 2000000, max: 5000000,  rate: 0.30, label: '2,000,001 – 5,000,000' },
  { min: 5000000, max: Infinity, rate: 0.35, label: '5,000,001 ขึ้นไป' },
];

const fmt = (v) => Math.round(Math.max(0, v)).toLocaleString('th-TH');
const toNum = (v) => Math.max(0, parseFloat(String(v).replace(/,/g, '')) || 0);

function progressiveTax(net) {
  if (net <= 0) return { tax: 0, rows: [] };
  let tax = 0, rows = [];
  for (const b of BRACKETS) {
    if (net <= b.min) break;
    const upper = b.max === Infinity ? net : Math.min(net, b.max);
    const amt = upper - b.min;
    const t = amt * b.rate;
    tax += t;
    rows.push({ ...b, amt, t, cum: tax });
    if (b.max === Infinity || net <= b.max) break;
  }
  return { tax, rows };
}

function Tip({ text }) {
  const [show, setShow] = useState(false);
  return (
    <span className="relative inline-block ml-1 align-middle">
      <button type="button"
        className="w-4 h-4 rounded-full bg-pink-300 hover:bg-pink-400 text-black text-xs font-bold leading-4 text-center"
        onMouseEnter={() => setShow(true)} onMouseLeave={() => setShow(false)}
        onClick={() => setShow(s => !s)}>?</button>
      {show && (
        <span className="absolute z-50 bottom-6 left-0 w-64 bg-black text-white text-xs rounded-lg p-2 shadow-xl leading-relaxed">
          {text}
        </span>
      )}
    </span>
  );
}

function Num({ label, value, onChange, cap, hint, tip, disabled }) {
  const val = toNum(value);
  const over = cap != null && val > cap;
  return (
    <div className="mb-3">
      <label className="block text-sm font-medium text-black mb-1">
        {label}{tip && <Tip text={tip} />}
      </label>
      <input type="text" inputMode="numeric" value={value} disabled={disabled}
        onChange={e => onChange(e.target.value.replace(/[^0-9.]/g, ''))}
        placeholder="0"
        className={`w-full border rounded-lg px-3 py-2 text-right text-sm focus:outline-none focus:ring-2 focus:ring-pink-300
          ${disabled ? 'bg-pink-50 text-gray-400 cursor-not-allowed' : 'bg-white text-black'}
          ${over ? 'border-red-400' : 'border-pink-200'}`} />
      {hint && <p className="text-xs text-gray-500 mt-0.5">{hint}</p>}
      {over && <p className="text-xs text-red-500 mt-0.5">⚠️ เกินสูงสุด {fmt(cap)} บาท — ระบบจะใช้ {fmt(cap)} บาทอัตโนมัติ</p>}
    </div>
  );
}

function Sec({ title, children, open: defaultOpen = false }) {
  const [open, setOpen] = useState(defaultOpen);
  return (
    <div className="mb-4 rounded-xl border border-pink-200 overflow-hidden shadow-sm">
      <button type="button" onClick={() => setOpen(o => !o)}
        className="no-print w-full flex justify-between items-center px-4 py-3 bg-pink-100 hover:bg-pink-200 transition-colors">
        <span className="font-semibold text-black text-sm md:text-base">{title}</span>
        <span className="text-pink-600 text-sm ml-2 flex-shrink-0">{open ? '▲' : '▼'}</span>
      </button>
      {/* always render content — CSS controls visibility on screen; print always shows */}
      <div className={`print-section-content p-4 bg-white ${open ? '' : 'hidden'}`}>{children}</div>
    </div>
  );
}

function Row({ label, value, indent, bold, highlight, red, green }) {
  const cls = [
    'flex justify-between py-0.5 text-sm',
    indent ? 'pl-4' : '',
    bold ? 'font-semibold' : '',
    highlight ? 'bg-pink-50 px-2 rounded font-bold text-pink-800' : '',
    red ? 'text-red-600 font-bold' : '',
    green ? 'text-green-600 font-bold' : '',
  ].filter(Boolean).join(' ');
  const display = typeof value === 'number'
    ? (value < 0 ? `-฿${fmt(Math.abs(value))}` : `฿${fmt(value)}`)
    : value;
  return (
    <div className={cls}>
      <span className={value < 0 && !red && !green ? 'text-gray-600' : ''}>{label}</span>
      <span>{display}</span>
    </div>
  );
}

function LoginScreen({ onOk }) {
  const [pw, setPw] = useState('');
  const [err, setErr] = useState(false);
  return (
    <div className="min-h-screen bg-pink-50 flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm border border-pink-200">
        <div className="text-center mb-6">
          <div className="text-5xl mb-3">🧾</div>
          <h1 className="text-xl font-bold text-black">เครื่องคิดเลขภาษีเงินได้</h1>
          <p className="text-sm text-pink-600 font-semibold mt-1">บุคคลธรรมดา ปีภาษี 2568</p>
          <p className="text-xs text-gray-400 mt-1">สำหรับบุคคลภายในเท่านั้น</p>
        </div>
        <form onSubmit={e => { e.preventDefault(); pw === PASSWORD ? onOk() : (setErr(true), setPw('')); }}>
          <label className="block text-sm font-medium text-black mb-1">รหัสผ่าน</label>
          <input type="password" value={pw} autoFocus
            onChange={e => { setPw(e.target.value); setErr(false); }}
            className={`w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-pink-300 mb-2 ${err ? 'border-red-400' : 'border-pink-200'}`}
            placeholder="กรอกรหัสผ่าน" />
          {err && <p className="text-xs text-red-500 mb-2">รหัสผ่านไม่ถูกต้อง กรุณาลองใหม่</p>}
          <button type="submit"
            className="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold rounded-lg py-2 transition-colors mt-1">
            เข้าสู่ระบบ
          </button>
        </form>
      </div>
    </div>
  );
}

function App() {
  const [auth, setAuth] = useState(false);
  const [incType, setIncType] = useState('40_1');
  const [income, setIncome] = useState('');
  const [otherInc, setOtherInc] = useState('');
  const [wht, setWht] = useState('');
  const [spouse, setSpouse] = useState('');
  const [children, setChildren] = useState('');
  const [pregnancy, setPregnancy] = useState('');
  const [parents, setParents] = useState('');
  const [disabledPpl, setDisabledPpl] = useState('');
  const [lifeIns, setLifeIns] = useState('');
  const [healthIns, setHealthIns] = useState('');
  const [parentHealth, setParentHealth] = useState('');
  const [annuity, setAnnuity] = useState('');
  const [socSec, setSocSec] = useState('');
  const [pvd, setPvd] = useState('');
  const [rmf, setRmf] = useState('');
  const [gpf, setGpf] = useState('');
  const [nsf, setNsf] = useState('');
  const [esg, setEsg] = useState('');
  const [mortgage, setMortgage] = useState('');
  const [newHouse, setNewHouse] = useState('');
  const [eReceipt, setEReceipt] = useState('');
  const [travelType, setTravelType] = useState('main');
  const [travelAmt, setTravelAmt] = useState('');
  const [don1, setDon1] = useState('');
  const [don2, setDon2] = useState('');

  // inc defined here so useMemo (hook) stays before any conditional return
  const inc = toNum(income);

  const calc = useMemo(() => {
    const inc = toNum(income);
    const other = toNum(otherInc);
    const gross = inc + other;
    const whtAmt = toNum(wht);
    const it = INCOME_TYPES.find(t => t.value === incType);
    const expD = it.cap ? Math.min(inc * it.rate, it.cap) : inc * it.rate;
    const personalD = 60000;
    const spouseD = Math.min(toNum(spouse), 60000);
    const childrenD = Math.floor(toNum(children)) * 30000;
    const pregnancyD = Math.min(toNum(pregnancy), 60000);
    const parentsD = Math.min(Math.floor(toNum(parents)), 4) * 30000;
    const disabledD = Math.floor(toNum(disabledPpl)) * 60000;
    const lifeD = Math.min(toNum(lifeIns), 100000);
    const healthRoom = Math.max(0, 100000 - lifeD);
    const healthD = Math.min(toNum(healthIns), 25000, healthRoom);
    const lifeHealthD = lifeD + healthD;
    const parentHealthD = Math.min(toNum(parentHealth), 15000);
    const annuityMax = Math.min(200000, inc * 0.15);
    const annuityD = Math.min(toNum(annuity), annuityMax);
    const socSecD = Math.min(toNum(socSec), 9000);
    const retCap = Math.min(500000, inc * 0.3);
    const pvdRaw = Math.min(toNum(pvd), inc * 0.15, 500000);
    const rmfRaw = Math.min(toNum(rmf), inc * 0.3);
    const gpfRaw = toNum(gpf);
    const nsfRaw = toNum(nsf);
    const retRaw = annuityD + pvdRaw + rmfRaw + gpfRaw + nsfRaw;
    const retScale = retRaw > 0 ? Math.min(1, retCap / retRaw) : 1;
    const annuityFinal = annuityD * retScale;
    const pvdFinal = pvdRaw * retScale;
    const rmfFinal = rmfRaw * retScale;
    const gpfFinal = gpfRaw * retScale;
    const nsfFinal = nsfRaw * retScale;
    const esgMax = Math.min(300000, inc * 0.3);
    const esgD = Math.min(toNum(esg), esgMax);
    const mortgageD = Math.min(toNum(mortgage), 100000);
    const newHouseD = Math.min(toNum(newHouse), 100000);
    const eReceiptD = Math.min(toNum(eReceipt), 50000);
    const travelMulti = travelType === 'secondary' ? 1.5 : 1.0;
    const travelCapAmt = travelType === 'secondary' ? 30000 : 20000;
    const travelD = Math.min(toNum(travelAmt) * travelMulti, travelCapAmt);
    const nonDonD = personalD + spouseD + childrenD + pregnancyD + parentsD + disabledD
      + lifeHealthD + parentHealthD + annuityFinal + socSecD
      + pvdFinal + rmfFinal + gpfFinal + nsfFinal + esgD
      + mortgageD + newHouseD + eReceiptD + travelD;
    const donBase = Math.max(0, gross - expD - nonDonD);
    const donCap = donBase * 0.1;
    const don1D = Math.min(toNum(don1), donCap);
    const don2D = Math.min(toNum(don2) * 2, Math.max(0, donCap - don1D));
    const donTotal = don1D + don2D;
    const totalD = nonDonD + donTotal;
    const netInc = Math.max(0, gross - expD - totalD);
    const { tax: pgTax, rows: bRows } = progressiveTax(netInc);
    let finalTax = pgTax, minTaxUsed = false;
    if (gross > 1200000) {
      const minTax = gross * 0.005;
      if (minTax > pgTax) { finalTax = minTax; minTaxUsed = true; }
    }
    const taxDue = finalTax - whtAmt;
    const effRate = gross > 0 ? (finalTax / gross) * 100 : 0;
    return {
      inc, other, gross, whtAmt, expD, expRate: it.rate,
      personalD, spouseD, childrenD, pregnancyD, parentsD, disabledD,
      lifeHealthD, parentHealthD, annuityFinal, socSecD,
      pvdFinal, rmfFinal, gpfFinal, nsfFinal, esgD,
      mortgageD, newHouseD, eReceiptD, travelD,
      don1D, don2D, donTotal, donBase, donCap,
      nonDonD, totalD, netInc, pgTax, finalTax, minTaxUsed,
      taxDue, effRate, bRows,
      retCap, retScale, annuityMax, esgMax, healthRoom,
    };
  }, [incType, income, otherInc, wht, spouse, children, pregnancy, parents, disabledPpl,
      lifeIns, healthIns, parentHealth, annuity, socSec, pvd, rmf, gpf, nsf, esg,
      mortgage, newHouse, eReceipt, travelType, travelAmt, don1, don2]);

  // Early return AFTER all hooks
  if (!auth) return <LoginScreen onOk={() => setAuth(true)} />;

  const reset = () => {
    setIncType('40_1'); setIncome(''); setOtherInc(''); setWht('');
    setSpouse(''); setChildren(''); setPregnancy(''); setParents(''); setDisabledPpl('');
    setLifeIns(''); setHealthIns(''); setParentHealth(''); setAnnuity('');
    setSocSec(''); setPvd(''); setRmf(''); setGpf(''); setNsf(''); setEsg('');
    setMortgage(''); setNewHouse('');
    setEReceipt(''); setTravelType('main'); setTravelAmt('');
    setDon1(''); setDon2('');
  };

  return (
    <div className="min-h-screen bg-pink-50 py-6 px-4">
      <div className="max-w-2xl mx-auto">

        {/* Header — screen only */}
        <div className="no-print text-center mb-6">
          <h1 className="text-xl md:text-2xl font-bold text-black">🧾 เครื่องคิดเลขภาษีเงินได้บุคคลธรรมดา</h1>
          <p className="text-pink-600 font-semibold mt-1">ปีภาษี 2568 (ยื่นภาษีปี 2569)</p>
          <p className="text-xs text-gray-400 mt-0.5">อ้างอิง ประมวลรัษฎากร ม.40, 47, 48 | สำหรับบุคคลภายในเท่านั้น</p>
        </div>

        {/* Summary Cards — screen only */}
        <div className="no-print grid grid-cols-2 gap-3 mb-4">
          {[
            { label: 'รายได้รวมทั้งสิ้น', val: `฿${fmt(calc.gross)}` },
            { label: 'ค่าลดหย่อนรวม', val: `฿${fmt(calc.totalD)}` },
            { label: 'เงินได้สุทธิ', val: `฿${fmt(calc.netInc)}`, pink: true },
            { label: 'อัตราภาษีที่แท้จริง', val: `${calc.effRate.toFixed(2)}%`, pink: true },
          ].map((c, i) => (
            <div key={i} className={`rounded-xl p-4 border border-pink-200 shadow-sm ${c.pink ? 'bg-pink-100' : 'bg-white'}`}>
              <p className="text-xs text-gray-500 mb-1">{c.label}</p>
              <p className="text-base md:text-lg font-bold text-black">{c.val}</p>
            </div>
          ))}
        </div>

        {/* Result Banner — screen only */}
        <div className={`no-print rounded-xl p-4 mb-6 border-2 text-center shadow-sm
          ${calc.taxDue > 0 ? 'bg-red-50 border-red-300' : calc.taxDue < 0 ? 'bg-green-50 border-green-300' : 'bg-white border-pink-200'}`}>
          <p className="text-sm text-gray-500 mb-1">
            {calc.taxDue > 0 ? '💸 ภาษีที่ต้องชำระเพิ่ม' : calc.taxDue < 0 ? '✅ ภาษีที่ขอคืนได้' : '✔️ ไม่มียอดชำระ/คืน'}
          </p>
          <p className={`text-3xl font-bold ${calc.taxDue > 0 ? 'text-red-600' : calc.taxDue < 0 ? 'text-green-600' : 'text-black'}`}>
            ฿{fmt(Math.abs(calc.taxDue))}
          </p>
          {calc.minTaxUsed && (
            <p className="text-xs text-orange-600 mt-2 bg-orange-50 rounded px-2 py-1">
              ⚠️ ใช้ภาษีขั้นต่ำ 0.5% × ฿{fmt(calc.gross)} = ฿{fmt(calc.gross * 0.005)} (มากกว่าภาษีขั้นบันได ฿{fmt(calc.pgTax)})
            </p>
          )}
        </div>

        {/* Input Sections — screen only */}
        <div className="no-print">

        {/* SECTION 1 */}
        <Sec title="หมวด 1 · รายได้" open={true}>
          <div className="mb-3">
            <label className="block text-sm font-medium text-black mb-1">
              ประเภทรายได้หลัก <Tip text="เลือกประเภทตามมาตราที่เกี่ยวข้อง ใช้กำหนดอัตราหักค่าใช้จ่ายเหมา" />
            </label>
            <select value={incType} onChange={e => setIncType(e.target.value)}
              className="w-full border border-pink-200 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-pink-300">
              {INCOME_TYPES.map(t => <option key={t.value} value={t.value}>{t.label}</option>)}
            </select>
            {(() => {
              const it = INCOME_TYPES.find(t => t.value === incType);

        <div className="no-print flex gap-3 mt-2 mb-4">
          <button type="button" onClick={() => window.print()}
            className="flex-1 bg-pink-500 hover:bg-pink-600 text-white font-semibold rounded-xl py-3 transition-colors text-sm shadow">
            🖨️ พิมพ์ / บันทึก PDF
          </button>
          <button type="button" onClick={reset}
            className="border-2 border-pink-400 text-pink-600 font-semibold rounded-xl py-3 px-4 hover:bg-pink-50 transition-colors text-sm">
            🔄 รีเซ็ต
          </button>
          <button type="button" onClick={() => setAuth(false)}
            className="border-2 border-gray-300 text-gray-500 font-semibold rounded-xl py-3 px-4 hover:bg-gray-50 transition-colors text-sm">
            ออก
          </button>
        </div>

        {/* Disclaimer (screen) */}
        <div className="no-print bg-yellow-50 border border-yellow-200 rounded-xl p-4 mb-8 text-xs text-gray-600 leading-relaxed">
          <p className="font-semibold text-yellow-700 mb-1">⚠️ ข้อสังเกต / Disclaimer</p>
          <p>ผลลัพธ์นี้เป็น<strong>การประมาณการเบื้องต้น</strong>เท่านั้น ควรปรึกษานักบัญชีหรือกรมสรรพากรเพื่อความถูกต้องสมบูรณ์</p>
          <p className="mt-1 text-gray-400">อ้างอิง: ประมวลรัษฎากร ม.40, 47, 48 | พ.ร.ฎ. ฉ.600, 629, 750, 780, 796 | กฎกระทรวง ฉ.126 | แบบ ภ.ง.ด.90/91 ปีภาษี 2568</p>
        </div>

        {/* ═══ PRINT-ONLY REPORT ═══ */}
        <div className="print-only">
          {/* Print Header */}
          <div className="print-header">
            <h1>🧾 สรุปการคำนวณภาษีเงินได้บุคคลธรรมดา</h1>
            <p>ปีภาษี 2568 (ยื่นแบบปี 2569) · อ้างอิง ประมวลรัษฎากร ม.40, 47, 48</p>
            <p className="date-line">พิมพ์เมื่อ: {new Date().toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' })}</p>
          </div>

          {/* Summary Cards */}
          <div className="print-cards">
            <div className="print-card">
              <p className="label">รายได้รวมทั้งสิ้น</p>
              <p className="value">฿{fmt(calc.gross)}</p>
            </div>
            <div className="print-card">
              <p className="label">ค่าลดหย่อนรวม</p>
              <p className="value">฿{fmt(calc.totalD)}</p>
            </div>
            <div className="print-card pink">
              <p className="label">เงินได้สุทธิ</p>
              <p className="value">฿{fmt(calc.netInc)}</p>
            </div>
            <div className="print-card pink">
              <p className="label">อัตราภาษีที่แท้จริง (Effective Rate)</p>
              <p className="value">{calc.effRate.toFixed(2)}%</p>
            </div>
          </div>

          {/* Result Banner */}
          <div className={`print-banner ${calc.taxDue > 0 ? 'due' : 'refund'}`}>
            <p className="banner-label">
              {calc.taxDue > 0 ? '💸 ภาษีที่ต้องชำระเพิ่ม' : calc.taxDue < 0 ? '✅ ภาษีที่ขอคืนได้' : '✔️ ไม่มียอดชำระ/คืน'}
            </p>
            <p className="banner-amount">฿{fmt(Math.abs(calc.taxDue))}</p>
            {calc.minTaxUsed && (
              <p style={{fontSize:'8pt',color:'#ea580c',marginTop:'4px'}}>
                ⚠️ ใช้กฎ 0.5% × ฿{fmt(calc.gross)} = ฿{fmt(calc.gross*0.005)} (มากกว่าภาษีขั้นบันได ฿{fmt(calc.pgTax)})
              </p>
            )}
          </div>

          {/* Calculation Detail */}
          <div className="print-sec-header">หมวด 3 · รายละเอียดการคำนวณทีละขั้น</div>
          <div className="print-sec-body">
            <div className="calc-row dim"><span>(+) รายได้หลัก ({INCOME_TYPES.find(t=>t.value===incType).label})</span><span>฿{fmt(calc.inc)}</span></div>
            {calc.other > 0 && <div className="calc-row dim"><span>(+) รายได้อื่น ๆ</span><span>฿{fmt(calc.other)}</span></div>}
            <div className="calc-row bold"><span>รายได้รวม</span><span>฿{fmt(calc.gross)}</span></div>
            <div className="calc-row dim"><span>(-) ค่าใช้จ่ายเหมา {(calc.expRate*100).toFixed(0)}%</span><span>-฿{fmt(calc.expD)}</span></div>
            <hr className="divider"/>
            <div style={{fontSize:'8pt',fontWeight:600,color:'#be185d',margin:'3px 0 1px'}}>ค่าลดหย่อน:</div>
            <div className="calc-row indent dim"><span>• ส่วนตัว</span><span>-฿{fmt(calc.personalD)}</span></div>
            {calc.spouseD>0 && <div className="calc-row indent dim"><span>• คู่สมรส</span><span>-฿{fmt(calc.spouseD)}</span></div>}
            {calc.childrenD>0 && <div className="calc-row indent dim"><span>• บุตร ({Math.floor(toNum(children))} คน)</span><span>-฿{fmt(calc.childrenD)}</span></div>}
            {calc.pregnancyD>0 && <div className="calc-row indent dim"><span>• ฝากครรภ์/คลอดบุตร</span><span>-฿{fmt(calc.pregnancyD)}</span></div>}
            {calc.parentsD>0 && <div className="calc-row indent dim"><span>• บิดามารดา ({Math.min(Math.floor(toNum(parents)),4)} คน)</span><span>-฿{fmt(calc.parentsD)}</span></div>}
            {calc.disabledD>0 && <div className="calc-row indent dim"><span>• ผู้พิการ ({Math.floor(toNum(disabledPpl))} คน)</span><span>-฿{fmt(calc.disabledD)}</span></div>}
            {calc.lifeHealthD>0 && <div className="calc-row indent dim"><span>• ประกันชีวิต + สุขภาพ</span><span>-฿{fmt(calc.lifeHealthD)}</span></div>}
            {calc.parentHealthD>0 && <div className="calc-row indent dim"><span>• ประกันสุขภาพบิดามารดา</span><span>-฿{fmt(calc.parentHealthD)}</span></div>}
            {calc.annuityFinal>0 && <div className="calc-row indent dim"><span>• ประกันชีวิตบำนาญ</span><span>-฿{fmt(calc.annuityFinal)}</span></div>}
            {calc.socSecD>0 && <div className="calc-row indent dim"><span>• ประกันสังคม</span><span>-฿{fmt(calc.socSecD)}</span></div>}
            {calc.pvdFinal>0 && <div className="calc-row indent dim"><span>• PVD</span><span>-฿{fmt(calc.pvdFinal)}</span></div>}
            {calc.rmfFinal>0 && <div className="calc-row indent dim"><span>• RMF</span><span>-฿{fmt(calc.rmfFinal)}</span></div>}
            {calc.gpfFinal>0 && <div className="calc-row indent dim"><span>• กบข.</span><span>-฿{fmt(calc.gpfFinal)}</span></div>}
            {calc.nsfFinal>0 && <div className="calc-row indent dim"><span>• กอช.</span><span>-฿{fmt(calc.nsfFinal)}</span></div>}
            {calc.esgD>0 && <div className="calc-row indent dim"><span>• Thai ESG/ESGX</span><span>-฿{fmt(calc.esgD)}</span></div>}
            {calc.mortgageD>0 && <div className="calc-row indent dim"><span>• ดอกเบี้ยเงินกู้บ้าน</span><span>-฿{fmt(calc.mortgageD)}</span></div>}
            {calc.newHouseD>0 && <div className="calc-row indent dim"><span>• ค่าสร้างบ้านใหม่</span><span>-฿{fmt(calc.newHouseD)}</span></div>}
            {calc.eReceiptD>0 && <div className="calc-row indent dim"><span>• Easy E-Receipt 2.0</span><span>-฿{fmt(calc.eReceiptD)}</span></div>}
            {calc.travelD>0 && <div className="calc-row indent dim"><span>• เที่ยวดีมีคืน 2568</span><span>-฿{fmt(calc.travelD)}</span></div>}
            {calc.don1D>0 && <div className="calc-row indent dim"><span>• บริจาคทั่วไป</span><span>-฿{fmt(calc.don1D)}</span></div>}
            {calc.don2D>0 && <div className="calc-row indent dim"><span>• บริจาคการศึกษา/กีฬา (×2)</span><span>-฿{fmt(calc.don2D)}</span></div>}
            <hr className="divider"/>
            <div className="calc-row bold"><span>(-) ค่าลดหย่อนรวม</span><span>-฿{fmt(calc.totalD)}</span></div>
            <hr className="divider dark"/>
            <div className="calc-row highlight"><span>(=) เงินได้สุทธิ</span><span>฿{fmt(calc.netInc)}</span></div>
            <div style={{marginTop:'6px'}}/>
            <div className="calc-row dim"><span>(×) ภาษีตามอัตราขั้นบันได</span><span>฿{fmt(calc.pgTax)}</span></div>
            {calc.minTaxUsed && <div className="calc-row dim"><span>→ ใช้กฎ 0.5% × ฿{fmt(calc.gross)} แทน</span><span>฿{fmt(calc.finalTax)}</span></div>}
            <div className="calc-row dim"><span>(-) ภาษีหัก ณ ที่จ่าย</span><span>-฿{fmt(calc.whtAmt)}</span></div>
            <hr className="divider dark"/>
            <div className={`calc-row ${calc.taxDue > 0 ? 'red' : calc.taxDue < 0 ? 'green' : 'bold'}`}>
              <span>(=) {calc.taxDue>0 ? 'ภาษีที่ต้องชำระเพิ่ม' : 'ภาษีที่ขอคืนได้'}</span>
              <span>฿{fmt(Math.abs(calc.taxDue))}</span>
            </div>
          </div>

          {/* Bracket Table */}
          <div className="print-sec-header" style={{marginTop:'10px'}}>ตารางอัตราภาษีขั้นบันได</div>
          <div className="print-sec-body">
            <table className="bracket-table">
              <thead>
                <tr>
                  <th>ช่วงเงินได้สุทธิ (บาท)</th>
                  <th style={{textAlign:'center'}}>อัตรา</th>
                  <th style={{textAlign:'right'}}>ภาษีในช่วงนี้</th>
                  <th style={{textAlign:'right'}}>ภาษีสะสม</th>
                </tr>
              </thead>
              <tbody>
                {BRACKETS.map((b, i) => {
                  const row = calc.bRows.find(r => r.min === b.min);
                  const isCurrent = calc.netInc > b.min && (b.max === Infinity ? true : calc.netInc <= b.max);
                  return (
                    <tr key={i} className={isCurrent ? 'active' : row ? 'used' : ''}>
                      <td>{b.label}</td>
                      <td style={{textAlign:'center'}}>{(b.rate*100).toFixed(0)}%</td>
                      <td style={{textAlign:'right'}}>{row ? `฿${fmt(row.t)}` : '—'}</td>
                      <td style={{textAlign:'right'}}>{row ? `฿${fmt(row.cum)}` : '—'}</td>
                    </tr>
                  );
                })}
              </tbody>
              <tfoot>
                <tr><td colSpan={2}>ภาษีรวม (ขั้นบันได)</td><td colSpan={2} style={{textAlign:'right'}}>฿{fmt(calc.pgTax)}</td></tr>
              </tfoot>
            </table>
          </div>

          {/* Print Disclaimer */}
          <div className="print-disclaimer">
            ⚠️ ผลลัพธ์นี้เป็นการประมาณการเบื้องต้นเท่านั้น ควรปรึกษานักบัญชีหรือกรมสรรพากรเพื่อความถูกต้องสมบูรณ์ |
            อ้างอิง: ประมวลรัษฎากร ม.40, 47, 48 · พ.ร.ฎ. ฉ.600, 629, 750, 780, 796 · กฎกระทรวง ฉ.126 · แบบ ภ.ง.ด.90/91 ปีภาษี 2568
          </div>
        </div>

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
